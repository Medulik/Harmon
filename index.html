<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Hotel | Horn&#237; informa&#269;n&#237; pruh</title>
  <style>
    :root {
      --green: #538262;
      --dark-green: #355c43;
      --muted: #7d8e80;
      --line: #8aab91;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--green); -webkit-font-smoothing: antialiased; }
    #strip {
      position: absolute; left: 0; top: 0; width: 1080px; height: 270px;
      overflow: hidden; background: var(--paper); transform-origin: 0 0;
      border-bottom: 1px solid #e4ebe5;
    }
    .divider { position: absolute; top: 34px; bottom: 34px; width: 1px; background: var(--line); }
    .divider.one { left: 307px; }
    .divider.two { left: 733px; }
    .eyebrow { margin: 0; font-size: 13px; font-weight: 500; line-height: 20px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--dark-green); }
    .current { position: absolute; top: 33px; left: 36px; width: 249px; }
    .current-main { display: flex; align-items: center; margin-top: 13px; height: 86px; }
    .current-icon { display: block; width: 79px; height: 79px; flex: 0 0 79px; margin-right: 10px; }
    .weather-icon svg { width: 100%; height: 100%; display: block; }
    .temperature { display: flex; align-items: flex-start; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #current-temperature { font-size: 70px; font-weight: 300; line-height: 1.06; letter-spacing: -4px; }
    .temperature-unit { font-size: 25px; line-height: 1; font-weight: 300; margin: 10px 0 0 6px; letter-spacing: 0; }
    #current-description { margin: 7px 0 0 3px; height: 24px; overflow: hidden; font-size: 18px; line-height: 24px; font-weight: 400; color: var(--dark-green); white-space: nowrap; }
    .status { display: flex; align-items: center; margin: 10px 0 0 4px; height: 16px; color: var(--muted); font-size: 11px; letter-spacing: .1px; white-space: nowrap; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; margin-right: 7px; background: #94a398; flex-shrink: 0; }
    #strip[data-state="live"] .status-dot { background: #729a76; }
    #strip[data-state="cached"] .status-dot { background: #b29461; }
    #strip[data-state="offline"] .status-dot { background: #aaaaaa; }
    .forecast { position: absolute; left: 333px; top: 33px; width: 375px; }
    .forecast-heading { margin-left: 8px; }
    .forecast-grid { display: flex; margin-top: 22px; }
    .forecast-day { width: 25%; text-align: center; }
    .day-name { height: 20px; font-size: 13px; font-weight: 500; line-height: 20px; letter-spacing: 1.15px; color: var(--dark-green); }
    .day-icon { width: 60px; height: 60px; margin: 8px auto 8px; }
    .day-temperatures { display: flex; justify-content: center; align-items: baseline; line-height: 28px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .day-high { font-size: 24px; font-weight: 400; color: var(--green); }
    .day-low { font-size: 16px; font-weight: 400; color: #879589; margin-left: 6px; }
    .forecast-key { margin: 11px 0 0 8px; color: var(--muted); font-size: 10px; letter-spacing: .7px; }
    .clock { position: absolute; left: 756px; top: 33px; width: 288px; text-align: center; }
    .clock .eyebrow { font-size: 12px; letter-spacing: 2px; }
    .clock-time { display: flex; align-items: baseline; justify-content: center; margin-top: 8px; height: 106px; font-size: 100px; font-weight: 300; line-height: 1; letter-spacing: -4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .clock-colon { position: relative; top: -5px; margin: 0 1px; font-size: 77px; font-weight: 300; }
    #clock-date { display: block; margin-top: 5px; font-size: 28px; font-weight: 300; line-height: 34px; letter-spacing: .5px; white-space: nowrap; }
    #clock-weekday { margin: 13px 0 0; font-size: 11px; line-height: 16px; letter-spacing: 2.3px; font-weight: 400; text-transform: uppercase; color: var(--muted); }
    .attribution { position: absolute; left: 40px; bottom: 13px; font-size: 9px; line-height: 13px; color: #798b7d; letter-spacing: .1px; }
    .attribution a { color: inherit; text-decoration: none; }
    .attribution a:hover, .attribution a:focus { text-decoration: underline; }
    .attribution span { margin: 0 5px; color: #b2bdb3; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    noscript { position: absolute; top: 0; left: 0; width: 100%; padding: 10px; background: white; color: #355c43; }
  </style>
</head>
<body>
  <!-- Only the top information strip. No logo, photos, QR code or other page sections. -->
  <header id="strip" data-state="loading" aria-label="Po&#269;as&#237; a m&#237;stn&#237; &#269;as">
    <section class="current" aria-labelledby="weather-heading">
      <h1 class="eyebrow" id="weather-heading">PO&#268;AS&#205; &middot; PRAHA</h1>
      <div class="current-main">
        <span id="current-icon" class="weather-icon current-icon" aria-hidden="true"></span>
        <div class="temperature"><span id="current-temperature">--</span><span class="temperature-unit">&deg;C</span></div>
      </div>
      <p id="current-description">Na&#269;&#237;t&#225;n&#237; po&#269;as&#237;</p>
      <div class="status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="weather-status">P&#345;ipojov&#225;n&#237; ke zdroji dat</span></div>
    </section>
    <div class="divider one" aria-hidden="true"></div>
    <section class="forecast" aria-labelledby="forecast-heading">
      <h2 class="eyebrow forecast-heading" id="forecast-heading">P&#344;EDPOV&#282;&#270;</h2>
      <div class="forecast-grid" id="forecast-grid"></div>
      <p class="forecast-key" id="forecast-key">DENN&#205; MAXIMUM / MINIMUM</p>
    </section>
    <div class="divider two" aria-hidden="true"></div>
    <section class="clock" aria-label="M&#237;stn&#237; &#269;as">
      <h2 class="eyebrow" id="clock-heading">M&#205;STN&#205; &#268;AS</h2>
      <div class="clock-time" role="timer" aria-live="off" id="clock-time"><span id="clock-hours">--</span><span class="clock-colon" aria-hidden="true">:</span><span id="clock-minutes">--</span></div>
      <time id="clock-date">--. --. ----</time>
      <p id="clock-weekday">PRAHA</p>
    </section>
    <div class="attribution"><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a><span>&middot;</span><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></div>
  </header>
  <noscript>Pro hodiny a po&#269;as&#237; je pot&#345;eba povolit JavaScript.</noscript>
  <script>
  /* ====================== USER SETTINGS ======================
     The free Open-Meteo endpoint is for evaluation/non-commercial use.
     For hotel production use, configure your licensed weather source.
     A commercial Open-Meteo account uses customer-api.open-meteo.com.
     Prefer a server-side proxy rather than exposing an API key in HTML.
     Keep provider attribution visible.
  =========================================================== */
  var HEADER_CONFIG = {
    city: "Praha",
    latitude: 50.0755,
    longitude: 14.4378,
    timeZone: "Europe/Prague",
    language: "cs",                  // "cs" or "en"; URL ?lang=en also works
    refreshMinutes: 15,
    retryMinutes: 1,
    maxWeatherAgeMinutes: 180,
    requestTimeoutSeconds: 12,
    apiBase: "https://api.open-meteo.com/v1/forecast",
    apiKey: "",                      // Never a secret when embedded in client HTML.
    proxyUrl: ""                     // Optional same-origin endpoint returning Open-Meteo JSON.
  };

  (function () {
    "use strict";
    var C = HEADER_CONFIG;
    var queryLanguage = /(?:\?|&)lang=(cs|en)(?:&|$)/.exec(window.location.search);
    if (queryLanguage) C.language = queryLanguage[1];
    var english = C.language === "en";
    var locale = english ? "en-GB" : "cs-CZ";
    var T = english ? {
      weather: "WEATHER", city: C.city === "Praha" ? "Prague" : C.city,
      forecast: "FORECAST", local: "LOCAL TIME", highlow: "DAILY HIGH / LOW",
      loading: "Loading weather", connecting: "Connecting to weather service",
      unavailable: "Weather unavailable", retry: "Retrying automatically",
      updated: "Updated", cached: "Last data", tomorrow: "TOMORROW"
    } : {
      weather: "PO\u010cAS\u00cd", city: C.city,
      forecast: "P\u0158EDPOV\u011a\u010e", local: "M\u00cdSTN\u00cd \u010cAS", highlow: "DENN\u00cd MAXIMUM / MINIMUM",
      loading: "Na\u010d\u00edt\u00e1n\u00ed po\u010das\u00ed", connecting: "P\u0159ipojov\u00e1n\u00ed ke zdroji dat",
      unavailable: "Po\u010das\u00ed nen\u00ed dostupn\u00e9", retry: "P\u0159ipojen\u00ed se automaticky obnov\u00ed",
      updated: "Aktualizov\u00e1no", cached: "Posledn\u00ed data", tomorrow: "Z\u00cdTRA"
    };
    var $ = function (id) { return document.getElementById(id); };
    var root = $("strip");
    var model = null, fetchedAt = 0, lastRequestFailed = false;
    var pending = false, retryTimer = null, firstRequestFinished = false;
    var lastDateKey = "", weatherDateKey = "";
    var cacheKey = "hotel.header.weather.v1:" + C.latitude + "," + C.longitude + ":" + C.timeZone;
    var refreshMs = Math.max(5, Number(C.refreshMinutes) || 15) * 60000;
    var retryMs = Math.max(1, Number(C.retryMinutes) || 1) * 60000;
    var maxAgeMs = Math.max(15, Number(C.maxWeatherAgeMinutes) || 180) * 60000;
    var dateFormatter, clockFormatter, weekdayFormatter, shortWeekdayFormatter;
    document.documentElement.lang = english ? "en" : "cs";
    $("weather-heading").textContent = T.weather + " \u00b7 " + T.city.toUpperCase();
    $("forecast-heading").textContent = T.forecast;
    $("forecast-key").textContent = T.highlow;
    $("clock-heading").textContent = T.local;
    $("current-description").textContent = T.loading;
    $("weather-status").textContent = T.connecting;

    // Fixed logical canvas: scales to fit its HTML zone, never stretches vertically.
    function resize() {
      var width = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1080);
      var height = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 270);
      var scale = Math.min(width / 1080, height / 270);
      root.style.transform = "scale(" + scale + ")";
      root.style.left = Math.max(0, (width - 1080 * scale) / 2) + "px";
    }
    resize();
    window.addEventListener("resize", resize);

    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function localParts(date) {
      var parts = dateFormatter.formatToParts(date), result = {};
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type !== "literal") result[parts[i].type] = parts[i].value;
      }
      return result;
    }
    function dateKey(date) {
      var p = localParts(date);
      return p.year + "-" + pad(Number(p.month)) + "-" + pad(Number(p.day));
    }
    function clockText(date) { return clockFormatter.format(date); }
    var clockReady = false;
    try {
      dateFormatter = new Intl.DateTimeFormat("en-GB", { timeZone: C.timeZone, year: "numeric", month: "2-digit", day: "2-digit" });
      clockFormatter = new Intl.DateTimeFormat("en-GB", { timeZone: C.timeZone, hour: "2-digit", minute: "2-digit", hour12: false });
      weekdayFormatter = new Intl.DateTimeFormat(locale, { timeZone: C.timeZone, weekday: "long" });
      shortWeekdayFormatter = new Intl.DateTimeFormat(locale, { timeZone: C.timeZone, weekday: "short" });
      localParts(new Date());
      clockReady = true;
    } catch (e) {
      $("clock-weekday").textContent = english ? "TIME ZONE NOT SUPPORTED" : "NEPODPOROVAN\u00c9 \u010cASOV\u00c9 P\u00c1SMO";
      console.warn("Time-zone support required:", e);
    }
    function updateClock() {
      if (!clockReady) return;
      var now = new Date(), p = localParts(now), time = clockText(now).split(":");
      $("clock-hours").textContent = time[0];
      $("clock-minutes").textContent = time[1];
      $("clock-time").setAttribute("aria-label", clockText(now));
      $("clock-date").textContent = Number(p.day) + ". " + Number(p.month) + ". " + p.year;
      var today = dateKey(now);
      $("clock-date").setAttribute("datetime", today);
      $("clock-weekday").textContent = weekdayFormatter.format(now);
      if (lastDateKey && lastDateKey !== today) { renderWeather(); loadWeather(); }
      lastDateKey = today;
    }

    // Original inline SVG icons: no external icon fonts, assets, libraries or CDN.
    var sun = '<g stroke="#c4aa59" stroke-width="2.2" stroke-linecap="round"><path d="M32 5v5M32 54v5M5 32h5M54 32h5M13 13l4 4M47 47l4 4M13 51l4-4M47 17l4-4"/><circle cx="32" cy="32" r="13" fill="#f4e5a6"/></g>';
    var moon = '<path d="M40 9a23 23 0 1 0 16 36A23 23 0 0 1 40 9Z" fill="#e7ead6" stroke="#87998e" stroke-width="2"/>';
    var cloud = '<path d="M15 45h36a10 10 0 0 0 1-20 15 15 0 0 0-29-4 10 10 0 0 0-14 10A8 8 0 0 0 15 45Z" fill="#eef2ed" stroke="#81938a" stroke-width="2.1" stroke-linejoin="round"/>';
    var rain = '<g stroke="#7ba0aa" stroke-width="2.5" stroke-linecap="round"><path d="m20 50-3 6m15-6-3 6m15-6-3 6"/></g>';
    var snow = '<g stroke="#8babb0" stroke-width="1.8" stroke-linecap="round"><path d="M20 49v10m-4-7 8 4m-8 0 8-4M43 49v10m-4-7 8 4m-8 0 8-4"/></g>';
    var fog = '<g stroke="#93a29a" stroke-width="2.2" stroke-linecap="round"><path d="M9 48h45M15 55h34M11 61h40"/></g>';
    var bolt = '<path d="m36 40-11 15h9l-4 10 16-18h-10l4-7Z" fill="#d5b96a" stroke="#a28b4f" stroke-width="1" stroke-linejoin="round"/>';
    var question = '<g fill="none" stroke="#a3b0a5" stroke-width="2" stroke-linecap="round"><circle cx="32" cy="32" r="21"/><path d="M26 25a6 6 0 1 1 10 5c-4 2-4 4-4 7M32 44v1"/></g>';
    function icon(code, isDay) {
      var body;
      if (code === 0) body = isDay === false ? moon : sun;
      else if (code === 1 || code === 2) body = '<g transform="translate(-4,-5) scale(.8)">' + (isDay === false ? moon : sun) + '</g>' + cloud;
      else if (code === 3) body = '<g transform="translate(6,-7) scale(.9)" opacity=".5">' + cloud + '</g>' + cloud;
      else if (code === 45 || code === 48) body = '<g transform="translate(0,-6)">' + cloud + '</g>' + fog;
      else if ([51,53,55,56,57,61,63,65,66,67,80,81,82].indexOf(code) !== -1) body = cloud + rain;
      else if ([71,73,75,77,85,86].indexOf(code) !== -1) body = cloud + snow;
      else if ([95,96,97,99].indexOf(code) !== -1) body = cloud + bolt;
      else body = question;
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68" fill="none" aria-hidden="true">' + body + '</svg>';
    }
    function description(code, isDay) {
      var value;
      if (code === 0) value = isDay === false ? ["Jasno", "Clear"] : ["Jasno", "Sunny"];
      else if (code === 1) value = ["Skoro jasno", "Mainly clear"];
      else if (code === 2) value = ["Polojasno", "Partly cloudy"];
      else if (code === 3) value = ["Zata\u017eeno", "Overcast"];
      else if (code === 45 || code === 48) value = ["Mlha", "Fog"];
      else if ([51,53,55].indexOf(code) !== -1) value = ["Mrholen\u00ed", "Drizzle"];
      else if ([56,57,66,67].indexOf(code) !== -1) value = ["Mrznouc\u00ed sr\u00e1\u017eky", "Freezing rain"];
      else if ([61,63,65].indexOf(code) !== -1) value = ["D\u00e9\u0161\u0165", "Rain"];
      else if ([80,81,82].indexOf(code) !== -1) value = ["P\u0159eh\u00e1\u0148ky", "Rain showers"];
      else if ([71,73,75,77].indexOf(code) !== -1) value = ["Sn\u011b\u017een\u00ed", "Snow"];
      else if ([85,86].indexOf(code) !== -1) value = ["Sn\u011bhov\u00e9 p\u0159eh\u00e1\u0148ky", "Snow showers"];
      else if ([95,96,97,99].indexOf(code) !== -1) value = ["Bou\u0159ky", "Thunderstorms"];
      else value = ["Po\u010das\u00ed", "Weather"];
      return value[english ? 1 : 0];
    }
    function numeric(n) { return typeof n === "number" && isFinite(n); }
    function degrees(n) { return numeric(n) ? String(Math.round(n)).replace("-", "\u2212") : "--"; }
    function validPayload(data) {
      if (!data || !data.current || !numeric(data.current.temperature_2m) || !numeric(data.current.time) || !numeric(data.current.weather_code)) return false;
      var d = data.daily;
      return !!(d && Array.isArray(d.time) && d.time.length >= 1 && Array.isArray(d.weather_code) && Array.isArray(d.temperature_2m_max) && Array.isArray(d.temperature_2m_min) && d.weather_code.length === d.time.length && d.temperature_2m_max.length === d.time.length && d.temperature_2m_min.length === d.time.length);
    }
    function nextDate(offset) {
      var today = localParts(new Date());
      // Local noon is used so calendar stepping also works across DST boundaries.
      return new Date(Date.UTC(Number(today.year), Number(today.month) - 1, Number(today.day) + offset, 12));
    }
    var dayNodes = [];
    for (var i = 0; i < 4; i++) {
      var div = document.createElement("div");
      div.className = "forecast-day";
      div.innerHTML = '<div class="day-name">--</div><div class="weather-icon day-icon" aria-hidden="true"></div><div class="day-temperatures"><span class="day-high">--\u00b0</span><span class="day-low">--\u00b0</span></div>';
      $("forecast-grid").appendChild(div);
      dayNodes.push(div);
    }
    function renderForecast(data) {
      if (!clockReady) return;
      var daily = data && data.daily;
      for (var j = 0; j < 4; j++) {
        var day = nextDate(j + 1), key = dateKey(day), idx = -1;
        if (daily) {
          for (var k = 0; k < daily.time.length; k++) {
            if (numeric(daily.time[k]) && dateKey(new Date(daily.time[k] * 1000)) === key) { idx = k; break; }
          }
        }
        var code = idx >= 0 && numeric(daily.weather_code[idx]) ? daily.weather_code[idx] : -1;
        var high = idx >= 0 ? daily.temperature_2m_max[idx] : null;
        var low = idx >= 0 ? daily.temperature_2m_min[idx] : null;
        var name = j === 0 ? T.tomorrow : shortWeekdayFormatter.format(day).replace(/\.$/, "").toUpperCase();
        var node = dayNodes[j];
        node.querySelector(".day-name").textContent = name;
        node.querySelector(".day-icon").innerHTML = icon(code, true);
        node.querySelector(".day-high").textContent = degrees(high) + "\u00b0";
        node.querySelector(".day-low").textContent = degrees(low) + "\u00b0";
        node.setAttribute("aria-label", key + ": " + (idx >= 0 ? description(code, true) + ", " + degrees(high) + " / " + degrees(low) + " \u00b0C" : T.unavailable));
        node.title = node.getAttribute("aria-label");
      }
      weatherDateKey = dateKey(new Date());
    }
    function renderWeather() {
      var now = Date.now();
      // Age is checked against BOTH the fetch time and the actual weather timestamp.
      var age = model ? Math.max(now - fetchedAt, now - model.current.time * 1000) : Infinity;
      var usable = model && age <= maxAgeMs && model.current.time * 1000 <= now + 3600000;
      if (!usable) {
        root.setAttribute("data-state", firstRequestFinished ? "offline" : "loading");
        $("current-temperature").textContent = "--";
        $("current-icon").innerHTML = icon(-1, true);
        $("current-description").textContent = firstRequestFinished ? T.unavailable : T.loading;
        $("weather-status").textContent = firstRequestFinished ? T.retry : T.connecting;
        root.title = "";
        renderForecast(null);
        return;
      }
      var cached = lastRequestFailed || now - fetchedAt > refreshMs * 2;
      root.setAttribute("data-state", cached ? "cached" : "live");
      $("current-temperature").textContent = degrees(model.current.temperature_2m);
      $("current-icon").innerHTML = icon(model.current.weather_code, model.current.is_day !== 0);
      $("current-description").textContent = description(model.current.weather_code, model.current.is_day !== 0);
      var modelTime = new Date(model.current.time * 1000);
      $("weather-status").textContent = (cached ? T.cached : T.updated) + " \u00b7 " + (clockReady ? clockText(modelTime) : "--:--");
      root.title = (english ? "Weather time: " : "\u010cas dat po\u010das\u00ed: ") + modelTime.toISOString();
      renderForecast(model);
    }
    function readCache() {
      try {
        var stored = JSON.parse(localStorage.getItem(cacheKey) || "null");
        if (stored && validPayload(stored.data) && numeric(stored.fetchedAt) && stored.fetchedAt <= Date.now() && Date.now() - stored.fetchedAt < maxAgeMs) {
          model = stored.data; fetchedAt = stored.fetchedAt; lastRequestFailed = true;
        }
      } catch (e) { /* localStorage may be disabled by the player; live mode still works. */ }
    }
    function saveCache() {
      try { localStorage.setItem(cacheKey, JSON.stringify({ fetchedAt: fetchedAt, data: model })); }
      catch (e) { /* Storage is an optional resilience feature. */ }
    }
    function apiUrl() {
      if (C.proxyUrl) return C.proxyUrl;
      var base = C.apiKey && C.apiBase === "https://api.open-meteo.com/v1/forecast" ? "https://customer-api.open-meteo.com/v1/forecast" : C.apiBase;
      var params = {
        latitude: C.latitude, longitude: C.longitude,
        current: "temperature_2m,weather_code,is_day",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        forecast_days: 6, timezone: C.timeZone, timeformat: "unixtime", temperature_unit: "celsius"
      };
      if (C.apiKey) params.apikey = C.apiKey;
      var pairs = [];
      for (var key in params) if (Object.prototype.hasOwnProperty.call(params, key)) pairs.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key]));
      return base + (base.indexOf("?") === -1 ? "?" : "&") + pairs.join("&");
    }
    function loadWeather() {
      if (pending) return;
      pending = true;
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      var request = new XMLHttpRequest(), finished = false;
      function finish(ok, payload) {
        if (finished) return;
        finished = true; pending = false; firstRequestFinished = true;
        if (ok) {
          model = payload; fetchedAt = Date.now(); lastRequestFailed = false; saveCache();
        } else {
          lastRequestFailed = true;
          retryTimer = setTimeout(loadWeather, retryMs);
        }
        renderWeather();
      }
      request.onload = function () {
        try {
          var data = JSON.parse(request.responseText);
          var weatherAge = data && data.current && numeric(data.current.time) ? Date.now() - data.current.time * 1000 : Infinity;
          finish(request.status >= 200 && request.status < 300 && validPayload(data) && weatherAge <= maxAgeMs && weatherAge >= -3600000, data);
        } catch (e) { finish(false); }
      };
      request.onerror = request.ontimeout = request.onabort = function () { finish(false); };
      try {
        request.open("GET", apiUrl(), true);
        request.timeout = Math.max(5, Number(C.requestTimeoutSeconds) || 12) * 1000;
        request.send();
      } catch (e) { finish(false); }
    }
    updateClock();
    readCache();
    renderWeather();
    loadWeather();
    setInterval(updateClock, 1000);
    setInterval(loadWeather, refreshMs);
    setInterval(function () { renderWeather(); }, 60000);
    window.addEventListener("online", loadWeather);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        updateClock(); renderWeather();
        if (lastRequestFailed || Date.now() - fetchedAt > refreshMs) loadWeather();
      }
    });
  }());
  </script>
</body>
</html>
